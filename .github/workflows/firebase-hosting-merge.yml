# Manual-only. wibbly's canonical home is vulos.org/products/wibbly (served
# from the vulos-cloud repo). This Firebase project (wibbly-io) is a legacy
# host; auto-deploying every push to main published a SECOND public copy that
# silently diverged from the canonical one. Trigger is now workflow_dispatch
# so a deploy is a deliberate act, not a side effect of merging.
name: Deploy to Firebase Hosting (manual)
on:
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WIBBLY_IO }}
          channelId: live
          projectId: wibbly-io
