<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="wibbly">
  <!-- wibbly mark — "Court Lights".
       A viewfinder bracket (the camera frame) with a motion trail resolving
       into a tracked landmark. The bracket uses a mid slate that reads on both
       light and dark surfaces; the trail carries the brand magenta. -->
  <defs>
    <linearGradient id="wb-trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"   stop-color="#FF4D9D" stop-opacity=".25"/>
      <stop offset=".55" stop-color="#FF4D9D" stop-opacity=".75"/>
      <stop offset="1"   stop-color="#E0007A" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Viewfinder brackets -->
  <g fill="none" stroke="#6E6479" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 61 V33 A12 12 0 0 1 33 21 H61"/>
    <path d="M139 21 H167 A12 12 0 0 1 179 33 V61"/>
    <path d="M179 139 V167 A12 12 0 0 1 167 179 H139"/>
    <path d="M61 179 H33 A12 12 0 0 1 21 167 V139"/>
  </g>

  <!-- Motion trail: a tracked wrist sweeping through the frame -->
  <path d="M55 148 Q92 142 118 114" fill="none" stroke="url(#wb-trail)" stroke-width="12" stroke-linecap="round" opacity=".5"/>
  <path d="M66 154 Q108 149 134 117" fill="none" stroke="url(#wb-trail)" stroke-width="17" stroke-linecap="round"/>

  <!-- The landmark: where the gesture resolves -->
  <circle cx="138" cy="113" r="18" fill="#E0007A"/>
  <circle cx="138" cy="113" r="7"  fill="#FFE3F0"/>
</svg>
