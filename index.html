    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-color: #6366f1;
        --secondary-color: #10b981;
        --accent-color: #f59e0b;
        --error-color: #ef4444;
        --background: #0f0f23;
        --surface: #1a1a2e;
        --text-primary: #ffffff;
        --text-secondary: #a1a1aa;
        --gradient-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #10b981 100%);
        --gradient-secondary: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        --gradient-gaming: linear-gradient(135deg, #ff6b35 0%, #f7931e 25%, #6366f1 50%, #8b5cf6 75%, #10b981 100%);
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: var(--background);
        color: var(--text-primary);
        line-height: 1.6;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        width: 100vw;
        min-height: 100vh;
        position: relative;
      }

      /* Enhanced loading animation */
      .wibbly-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #2d1b69 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.8s ease-out;
      }

      .wibbly-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-logo {
        font-size: 3rem;
        font-weight: 900;
        background: var(--gradient-gaming);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: logoGlow 2s ease-in-out infinite alternate;
        margin-bottom: 1rem;
      }

      .loader-tagline {
        font-size: 1.1rem;
        color: var(--text-secondary);
        font-weight: 500;
        margin-bottom: 2rem;
        opacity: 0;
        animation: fadeInUp 1s ease-out 0.5s forwards;
      }

      .loader-progress {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }

      .loader-progress::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: var(--gradient-gaming);
        animation: loading 2s ease-in-out infinite;
      }

      @keyframes logoGlow {
        0% { 
          transform: scale(1);
          filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.4));
        }
        100% { 
          transform: scale(1.05);
          filter: drop-shadow(0 0 40px rgba(99, 102, 241, 0.8));
        }
      }

      @keyframes loading {
        0% { left: -100%; }
        50% { left: 0%; }
        100% { left: 100%; }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--surface);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--gradient-primary);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--primary-color);
      }

      /* Selection styling */
      ::selection {
        background: rgba(99, 102, 241, 0.3);
        color: var(--text-primary);
      }

      /* Performance optimizations */
      .background-canvas {
        will-change: transform;
      }

      .btn {
        will-change: transform;
      }
    </style>

  <body>
    <!-- Enhanced Loading Screen -->
    <div class="wibbly-loader" id="loader">
      <div class="loader-logo">Wibbly</div>
      <div class="loader-tagline">🎾 Motion-Controlled Gaming</div>
      <div class="loader-progress"></div>
    </div>

    <div id="root"></div>
    
    <script>
      // Enhanced loader with game-like feel
      window.addEventListener('load', () => {
        const loader = document.getElementById('loader');
        if (loader) {
          setTimeout(() => {
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 800);
          }, 1200); // Longer delay for more dramatic effect
        }
      });

      // Preload critical game assets
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Service worker registration failed, but that's okay
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
