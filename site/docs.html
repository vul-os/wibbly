<!doctype html>
<html lang="en" data-theme="dark" data-theme-pref="system">
<head>
<meta charset="utf-8" />
<title>wibbly — docs</title>
<meta name="description" content="wibbly documentation — the camera-gesture game on magnetite. Architecture, the four seams, model selection, multiplayer, configuration and roadmap. Frames never leave the device." />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="./product-logos/wibbly.svg" />

<!-- Resolve theme before paint to avoid a flash. Preference (light|dark|system)
     lives in localStorage 'vulos-theme'; <html data-theme> holds the RESOLVED
     light|dark value so CSS and theme-aware imagery switch together. -->
<script>
  (function () {
    try {
      var pref = localStorage.getItem('vulos-theme') || 'system';
      var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var resolved = pref === 'system' ? sys : pref;
      document.documentElement.setAttribute('data-theme', resolved);
      document.documentElement.setAttribute('data-theme-pref', pref);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

<script>
/* ── Theme selector (shared behaviour with the landing) ──────────────────── */
(function () {
  var root = document.documentElement;
  var mql = window.matchMedia('(prefers-color-scheme: dark)');
  function resolve(pref) { return pref === 'system' ? (mql.matches ? 'dark' : 'light') : pref; }
  function currentPref() { try { return localStorage.getItem('vulos-theme') || 'system'; } catch (e) { return 'system'; } }
  function paintSeg(pref) {
    document.querySelectorAll('.seg button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.set === pref));
    });
  }
  function apply(pref) {
    root.setAttribute('data-theme', resolve(pref));
    root.setAttribute('data-theme-pref', pref);
    paintSeg(pref);
  }
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      var pref = b.dataset.set;
      try { localStorage.setItem('vulos-theme', pref); } catch (e) {}
      apply(pref);
    });
  });
  mql.addEventListener('change', function () { if (currentPref() === 'system') apply('system'); });
  apply(currentPref());
})();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Docs viewer. Renders ./docs/<FILE>.md via the locally vendored `marked`.
   #slug and #slug#heading deep-links both work; the active sidebar entry
   tracks the route. No network request leaves the origin.
   ═══════════════════════════════════════════════════════════════════════════ */
const GROUPS = [
  { title: 'Start here', items: [
    { slug: 'overview',         title: 'Overview',               path: './docs/OVERVIEW.md' },
    { slug: 'getting-started',  title: 'Getting started',        path: './docs/GETTING-STARTED.md' },
  ]},
  { title: 'How it works', items: [
    { slug: 'architecture',     title: 'Architecture',           path: './docs/ARCHITECTURE.md' },
    { slug: 'models',           title: 'Model selection',        path: './docs/MODELS.md' },
    { slug: 'multiplayer',      title: 'Multiplayer & anti-cheat', path: './docs/MULTIPLAYER.md' },
  ]},
  { title: 'Run it', items: [
    { slug: 'configuration',    title: 'Configuration',          path: './docs/CONFIGURATION.md' },
    { slug: 'runtime-targets',  title: 'Runtime targets',        path: './docs/RUNTIME-TARGETS.md' },
  ]},
  { title: 'The project', items: [
    { slug: 'roadmap',          title: 'Roadmap',                path: './docs/ROADMAP.md' },
  ]},
];

const DOCS = GROUPS.flatMap(g => g.items);
const bySlug = Object.fromEntries(DOCS.map(d => [d.slug, d]));
const byFile = Object.fromEntries(DOCS.map(d => [d.path.split('/').pop().toLowerCase(), d]));

const content  = document.getElementById('content');
const crumb    = document.getElementById('crumb');
const footnav  = document.getElementById('footnav');
const navList  = document.getElementById('navList');
const body     = document.body;

/* Build the sidebar from GROUPS, numbered like a broadcast rundown. */
(function buildNav(){
  let n = 0;
  GROUPS.forEach(g => {
    const h = document.createElement('div');
    h.className = 'grp'; h.textContent = g.title;
    navList.appendChild(h);
    g.items.forEach(d => {
      n++;
      const a = document.createElement('a');
      a.href = '#' + d.slug; a.dataset.slug = d.slug;
      a.innerHTML = '<span class="idx">' + String(n).padStart(2,'0') + '</span><span>' + d.title + '</span>';
      navList.appendChild(a);
    });
  });
})();

if (window.marked && marked.setOptions) marked.setOptions({ gfm: true, breaks: false });

function slugifyHeading(text){
  return String(text).toLowerCase().trim()
    .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
}

function setActive(slug){
  document.querySelectorAll('.docs-nav a').forEach(a =>
    a.classList.toggle('active', a.dataset.slug === slug));
}

function renderCrumb(doc){
  crumb.innerHTML = '';
  const home = document.createElement('a');
  home.href = './index.html'; home.textContent = 'wibbly';
  const s1 = document.createElement('span'); s1.className = 'sep'; s1.textContent = '/';
  const docs = document.createElement('a');
  docs.href = '#' + DOCS[0].slug; docs.textContent = 'Docs';
  const s2 = document.createElement('span'); s2.className = 'sep'; s2.textContent = '/';
  const cur = document.createElement('span'); cur.className = 'cur'; cur.textContent = doc.title;
  crumb.append(home, s1, docs, s2, cur);
}

function renderFootnav(doc){
  footnav.innerHTML = '';
  const i = DOCS.findIndex(d => d.slug === doc.slug);
  if (i > 0){
    const p = DOCS[i-1];
    const a = document.createElement('a'); a.className = 'prev'; a.href = '#' + p.slug;
    a.innerHTML = '<span class="dir">← Previous</span><span class="ttl">' + p.title + '</span>';
    footnav.appendChild(a);
  }
  if (i < DOCS.length - 1){
    const nx = DOCS[i+1];
    const a = document.createElement('a'); a.className = 'next'; a.href = '#' + nx.slug;
    a.innerHTML = '<span class="dir">Next →</span><span class="ttl">' + nx.title + '</span>';
    footnav.appendChild(a);
  }
}

async function load(slug, headingId){
  const doc = bySlug[slug] || DOCS[0];
  setActive(doc.slug);
  renderCrumb(doc);
  content.innerHTML = '<p class="loading">Loading…</p>';
  try {
    const res = await fetch(doc.path, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    content.innerHTML = marked.parse(md);

    // Give headings stable anchor ids for #slug#heading deep-links.
    content.querySelectorAll('h2, h3, h4').forEach(h => {
      if (!h.id) h.id = slugifyHeading(h.textContent);
    });

    // The docs embed screenshots with deploy-absolute paths
    // (/products/magnetite/wibbly/shots/…). Repoint them at the shots that
    // sit next to this file so the page stays entirely origin-relative.
    content.querySelectorAll('img[src]').forEach(img => {
      const s = img.getAttribute('src') || '';
      if (/^https?:/i.test(s)) return;
      const m = s.match(/\/shots\/([^/?#]+)$/);
      if (m) img.setAttribute('src', './shots/' + m[1]);
    });

    // Cross-doc links (e.g. ARCHITECTURE.md, ./MODELS.md#seams) become in-app routes.
    content.querySelectorAll('a[href]').forEach(a => {
      const h = a.getAttribute('href') || '';
      if (/^(https?:|#|mailto:)/i.test(h)) return;
      const m = h.match(/([^\/]+\.md)(#.*)?$/i);
      const target = m && byFile[m[1].toLowerCase()];
      if (target) a.setAttribute('href', '#' + target.slug + (m[2] || '').replace('#', '#'));
    });
    content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });

    renderFootnav(doc);

    if (headingId){
      const el = document.getElementById(headingId);
      if (el){ el.scrollIntoView({ behavior: 'auto', block: 'start' }); return; }
    }
    window.scrollTo({ top: 0 });
  } catch (err) {
    content.innerHTML = '<div class="docs-error">Could not load <code>' +
      doc.path.split('/').pop() + '</code> — ' + err.message + '</div>';
    footnav.innerHTML = '';
  }
}

/* Route parsing: "#slug" or "#slug#heading". */
function route(){
  const raw = (location.hash || '').replace(/^#/, '');
  if (!raw) return { slug: DOCS[0].slug, heading: null };
  const parts = raw.split('#');
  return { slug: parts[0] || DOCS[0].slug, heading: parts[1] || null };
}

let lastSlug = null;
function go(){
  const { slug, heading } = route();
  if (slug === lastSlug && heading){
    const el = document.getElementById(heading);
    if (el){ el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  }
  lastSlug = slug;
  load(slug, heading);
  closeNav();
}

window.addEventListener('hashchange', go);

/* ── Mobile drawer ───────────────────────────────────────────────────────── */
const menuToggle = document.getElementById('menuToggle');
const scrim = document.getElementById('scrim');
function openNav(){ body.classList.add('nav-open'); menuToggle.setAttribute('aria-expanded','true'); }
function closeNav(){ body.classList.remove('nav-open'); menuToggle.setAttribute('aria-expanded','false'); }
menuToggle.addEventListener('click', () => body.classList.contains('nav-open') ? closeNav() : openNav());
scrim.addEventListener('click', closeNav);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNav(); });

go();
</script>
</body>
